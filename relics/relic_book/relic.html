<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Relic Collection</title>
<link rel="icon" type="image/x-icon" href="../general/textures/icons/orby.png">
<link rel="stylesheet" href="front.css">
  <!-- Flavor text preview metadata -->
  <meta property="og:title" content="Tama Wiki" />
  <meta property="og:description" content="Relic collection for Tama Wiki" />
  <meta property="og:image" content="https://tamawiki.pages.dev/logo.png" />

  <!-- Optional Twitter card support -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Tama Wiki" />
  <meta name="twitter:description" content="Relic collection for Tama Wiki" />
  <meta name="twitter:image" content="https://tamawiki.pages.dev/logo.png" />
</head>

<body>

<div class="book">
  <button id="menuBtn" class="menu-btn" type="button" title="Open relic menu" onclick="window.location.href='../relic_menu.html'">Menu</button>
  <button id="searchBtn" class="search-btn" title="Search relic">🔍</button>

  <!-- Search popup -->
  <div id="searchPopup" class="search-popup" aria-hidden="true">
    <div class="search-header">
      <input id="searchInput" class="search-input" placeholder="Type relic name..." aria-label="Search relic by name" />
      <button id="searchClose" class="search-close" title="Close">✖</button>
    </div>
    <ul id="searchResults" class="search-results" role="listbox" aria-label="Search results"></ul>
  </div>
  <!-- LEFT PAGE -->
  <!-- Bookmarks (left side) -->
  <div class="bookmarks" aria-hidden="false">
    <button class="bookmark bm1" data-page="1" title="Go to page 1"><span class="num">1</span><span class="label">Grade 4</span></button>
    <button class="bookmark bm2" data-page="15" title="Go to page 15"><span class="num">2</span><span class="label">Grade 3</span></button>
    <button class="bookmark bm3" data-page="26" title="Go to page 26"><span class="num">3</span><span class="label">Grade 2</span></button>
    <button class="bookmark bm4" data-page="33" title="Go to page 33"><span class="num">4</span><span class="label">Grade 1</span></button>
  </div>

  <div class="page left">
    <div class="box name" id="div1"></div>
    <div class="grade" id="div4"></div>

    <!-- IMAGE PLACEHOLDER (giữ layout, không dùng data) -->
    <div class="image-box">
      <div id="flipCard" class="flip-card" role="button" tabindex="0" aria-pressed="false" title="Click to flip">
        <div class="flip-inner">
          <div class="flip-front">
            <img id="imgA" src="" alt="Relic image A">
          </div>
          <div class="flip-back">
            <img id="imgB" src="" alt="Relic image B">
          </div>
        </div>
      </div>
    </div>

    <div class="box description" id="div3"></div>
  </div>

  <!-- RIGHT PAGE -->
  <div class="page right">
    <div class="box">
      <h3>Details</h3>
      <ul id="div5"></ul>
    </div>

    <div class="box">
      <h3>Extra</h3>
      <div id="div6"></div>
    </div>
    <div id=bkmark>
      <img src="miscellaneous/bookmark.png" id="mark" alt="Bookmark Background">
      <a href="/index.html" id="go_back">
        <img src="miscellaneous/red_cross.png" alt="EXIT"/>
      </a>   
    </div>
  </div>
</div>

<div class="nav">
  <button onclick="prev()">◀</button>
  <input id="page" class="page-indicator" />
  <button onclick="next()">▶</button>
</div>

<!-- IMPORTANT -->
<script type="module" src="back.js"></script>

</body>
</html>
