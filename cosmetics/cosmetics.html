<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cosmetic Wardrobe</title>
<link rel="stylesheet" href="style.css">

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js"
  }
}
</script>
</head>

<body>
<div class="container">
  <div class="viewer" id="viewer">
    <div class="price-counter" id="priceCounter" aria-live="polite">
      <div class="price-total"><span id="priceTotal">0</span> coins</div>
      <div class="price-list" id="priceList"></div>
    </div>
  </div>

  <div class="ui">
    <div class="section">
      <h2>Hats</h2>
      <div class="grid" id="hatList"></div>
    </div>

    <div class="section">
      <h2>Backpacks</h2>
      <div class="grid" id="backpackList"></div>
    </div>
  </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
