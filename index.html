<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TAMAWIKI</title>
  <link rel="icon" type="image/x-icon" href="general/textures/icons/orby.png">
  <link rel="stylesheet" href="styles.css">

  <!-- Flavor text preview metadata -->
  <meta property="og:title" content="Tama Wiki" />
  <meta property="og:description" content="Wiki that actually does cover ALL the information in abyss." />
  <meta property="og:image" content="https://tamawiki.pages.dev/logo.png" />

  <!-- Optional Twitter card support -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Tama Wiki" />
  <meta name="twitter:description" content="Wiki that actually does cover ALL the information in abyss." />
  <meta name="twitter:image" content="https://tamawiki.pages.dev/logo.png" />
</head>
<body>
<div class="global-search">
  <button id="searchButton" class="search-button" type="button" aria-label="Open wiki search" title="Search" aria-expanded="false" aria-controls="searchPanel">🔍</button>
  <div id="searchPanel" class="search-panel" aria-hidden="true">
    <label for="globalSearchInput">Search the wiki</label>
    <input id="globalSearchInput" type="search" placeholder="Search relics, creatures, guides..." autocomplete="off">
    <div id="searchResults" class="search-results" role="listbox" aria-label="Search results"></div>
  </div>
</div>
<div class="wrapper">
  <div class="logo logoBtn" onclick="window.location.href='/index.html';">
    <img src="logo.png" alt="TAMAWIKI LOGO">
  </div>

  <div class="buttonArea" id="buttonbox">
    <div class="btn" onclick="window.location.href='./relics/relic_menu.html';"><span data-i18n="relics">RELICS</span></div>
    <div class="btn" onclick="window.location.href='./bestiary/bestiary_menu.html';"><span data-i18n="bestiary">BESTIARY</span></div>
    <div class="btn" onclick="window.location.href='./recipe/recipe_list.html';"><span data-i18n="mobDrops">MOB DROPS</span></div>
    <div class="btn" onclick="window.location.href='./guide/guide.html';"><span data-i18n="guides">GUIDES</span></div>
    <div class="btn" onclick="window.location.href='./miscellaneous/miscellaneous.html';"><span data-i18n="miscellaneous">MISCELLANEOUS</span></div>
  </div>

  <div class="row">
    <div>
      <a class="gallery gallery-link" href="galery/gallery.html">
        <span data-i18n="openGallery">OPEN GALLERY</span>
      </a>

      <div class="changeLog">
        <b data-i18n="changeLog">CHANGE LOG:</b><br><br>
        <div id="changeLogList"></div>
      </div>
    </div>

    <a href="map/map.html" class="abyss">
      <img src="main_img/abyss_img_test_6KRes.jpg" alt="Abyss Map">
    </a>
  </div>
</div>

<div class="info">
  <p><b data-i18n="disclaimer">DISCLAIMER:</b><br>
  <span id="disclaimerText"></span>
</p>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
